services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Moselwal\FA4T3\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Autowiring cannot guess which class satisfies the interface, and there is
  # only ever one: the HTTP client. Without this every consumer of the
  # interface fails to resolve at container build time.
  Moselwal\FA4T3\Service\Fa4t3ApiClientInterface:
    alias: Moselwal\FA4T3\Service\Fa4t3ApiClient

  Moselwal\FA4T3\Controller\Backend\DashboardController:
    public: true

  Moselwal\FA4T3\Controller\Backend\PageDataAjaxController:
    public: true

  cache.fa4t3_api:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory:
      - '@TYPO3\CMS\Core\Cache\CacheManager'
      - 'getCache'
    arguments:
      - 'fa4t3_api'

  Moselwal\FA4T3\Service\AnalyticsService:
    arguments:
      $cache: '@cache.fa4t3_api'
